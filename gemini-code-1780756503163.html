<div class="container">
    <h1>學術活動總表：學生報告分數配對互動軌跡圖</h1>
    <div class="subtitle">追蹤同一個學術報告在不同評審老師手上的評分波動，揭示評審個人風格與指標偏好偏誤</div>
    
    <div class="instructions">
        <strong>💡 會議互動操作指南（學術活動）：</strong><br>
        1. <strong>橫軸（X軸）</strong>已由左至右依據「老師平均給分最低到最高」排序。線條整體左低右高是正常的，若出現交叉代表評審共識低。<br>
        2. <strong>滑鼠游標移到線條上</strong>可單獨查看該報告的各評審得分。<br>
        3. <strong>點擊圖表中的任意圓點</strong>，將會單獨高亮（Highlight）該位學生的分數軌跡，其他線條會變淡，適合展示特定學生被「大洗牌」的現象。
    </div>

    <div class="chart-container">
        <canvas id="interactionChart"></canvas>
    </div>
    
    <button class="btn-reset" onclick="resetHighlight()">重置圖表（恢復顯示全員）</button>
</div>

    datasetsData.forEach(ds => {
        ds.originalColor = ds.borderColor;
    });

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: originalLabels,
            datasets: datasetsData
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: true,
                    position: 'right',
                    labels: { boxWidth: 12, font: { size: 10 } }
                },
                tooltip: { mode: 'nearest', intersect: false }
            },
            scales: {
                x: { title: { display: true, text: '評分評審代號（由左至右依平均分數從嚴格到寬鬆排序）', font: { weight: 'bold', size: 13 } } },
                y: { min: 60, max: 100, title: { display: true, text: '評審打分分數', font: { weight: 'bold', size: 13 } } }
            },
            onClick: (e) => {
                const points = chart.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true);
                if (points.length > 0) {
                    const datasetIndex = points[0].datasetIndex;
                    highlightDataset(datasetIndex);
                }
            }
        }
    });

    function highlightDataset(index) {
        chart.data.datasets.forEach((dataset, i) => {
            if (i === index) {
                dataset.borderColor = dataset.activeColor;
                dataset.backgroundColor = dataset.activeColor;
                dataset.borderWidth = 3;
            } else {
                dataset.borderColor = 'rgba(220, 220, 220, 0.15)';
                dataset.backgroundColor = 'rgba(220, 220, 220, 0.15)';
                dataset.borderWidth = 1;
            }
        });
        chart.update();
    }

    function resetHighlight() {
        chart.data.datasets.forEach(dataset => {
            dataset.borderColor = dataset.originalColor;
            dataset.backgroundColor = dataset.originalColor;
            dataset.borderWidth = 1.5;
        });
        chart.update();
    }
